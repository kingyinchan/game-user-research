# 项目配置文件
# 修改此文件以适配不同的分析主题，代码无需任何改动。

# -- 分析主题 --
topic:
  game: "鸣潮"                    # 游戏名称
  version: "3.2"                  # 版本号（用于图表标题）
  target: "西格莉卡"              # 本次分析的核心目标（角色/版本/功能等）
  display_name: "鸣潮 3.2 西格莉卡专题"  # 项目展示名称（用于报告标题）
  target_aliases:                  # 目标的别名/昵称列表（LLM 标注时使用）
    - "小橘子"
    - "橘橘宝"
    - "耙耙柑"
    - "粑粑柑"
    - "西西"
    - "西格"

# -- 数据路径（相对于 analysis/ 目录） --
paths:
  raw_data: "../crawler/MediaCrawler/data/xhs/jsonl"
  cleaned_data: "cleaned_data"
  output: "output"

# -- 分析配置 --
analysis:
  negative_sentiments: ["negative", "mixed"]  # 视为负面的情绪标签

# -- LLM 标注配置 --
llm:
  temperature: 0.1
  max_tokens: 1024
  batch_size: 3                    # 每次请求处理条数，优先降低 RPM 压力
  retry_attempts: 6                # 失败重试次数
  retry_min_wait: 3                # 重试最小等待秒数
  retry_max_wait: 90               # 重试最大等待秒数
  request_interval_seconds: 1.5    # 每次请求后额外暂停，降低限流风险
  transient_error_cooldown_seconds: 60  # 限流/连接错误后等待再退出
  retry_failed_cache: true         # summary_reason 为“标注失败:”的旧缓存会被重新尝试
  enable_rule_router: true         # 规则预标高置信样本
  enable_text_reuse: true          # 完全相同的 clean text 直接复用标签

# -- Agent 配置 --
agents:
  artifacts_dir: "artifacts/agents"
  reports_dir: "reports"
  default_tasks:
    - "data_quality_review"
    - "label_review_queue"
    - "insight_report"
  quality_thresholds:
    empty_comment_rate: 0.10
    duplicate_clean_text_rate: 0.15
    orphan_comment_rate: 0.05
    short_comment_rate: 0.25
  review_queue:
    long_text_min_length: 6
    max_examples_per_reason: 20
  pipeline:
    continue_on_failure: false
    reuse_existing_labeled: true
    downstream_tasks:
      - "label_review_queue"
      - "insight_report"
  llm:
    enabled: false
    temperature: 0.2
    max_tokens: 1200
  report_llm:
    enabled: true
    api_key_env: "REPORT_OPENAI_API_KEY"
    base_url_env: "REPORT_OPENAI_BASE_URL"
    model_env: "REPORT_OPENAI_MODEL"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    model: "gemini-2.5-flash"
    temperature: 0.3
    max_tokens: 2200
    extra_body:
      google:
        thinking_config:
          thinking_budget: 0
    sample_size_per_bucket: 5
    max_review_examples: 4
    top_module_limit: 5

# -- 竞品列表（可选，用于后续分析） --
competitors:
  - name: "原神"
    keywords: ["原神"]
  - name: "崩坏:星穹铁道"
    keywords: ["星铁", "崩铁", "星穹铁道"]
  - name: "战双帕弥什"
    keywords: ["战双"]
  - name: "明日方舟"
    keywords: ["方舟", "明日方舟"]
