<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game User Research Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero card">
        <div class="hero-copy">
          <p class="eyebrow">AI Game User Research Studio</p>
          <h1 id="topic-title">Loading topic…</h1>
          <p id="topic-subtitle" class="hero-subtitle">Fetching dashboard data</p>
        </div>
        <div class="hero-actions">
          <button id="refresh-button" class="button button-ghost" type="button">刷新数据</button>
          <button id="run-button" class="button button-solid" type="button">运行完整流</button>
        </div>
      </header>

      <main class="layout">
        <section class="main-column">
          <div class="panel-grid metrics-grid" id="metrics-grid"></div>

          <section class="card section-block commentary-block">
            <div class="section-head">
              <div>
                <p class="eyebrow">LLM Commentary</p>
                <h2>研究点评</h2>
              </div>
              <span id="commentary-status" class="status-pill status-neutral">Waiting</span>
            </div>
            <div id="llm-commentary" class="rich-text empty-state">正在加载点评…</div>
          </section>

          <section class="card section-block charts-block">
            <div class="section-head">
              <div>
                <p class="eyebrow">Charts</p>
                <h2>统计图表</h2>
              </div>
            </div>
            <div id="charts-grid" class="charts-grid"></div>
          </section>

          <section class="card section-block review-block">
            <div class="section-head">
              <div>
                <p class="eyebrow">Review Queue</p>
                <h2>人工复核队列</h2>
              </div>
              <span id="review-count" class="meta-chip">0 items</span>
            </div>
            <div id="review-queue" class="review-list"></div>
          </section>
        </section>

        <aside class="side-column">
          <section class="card section-block">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Pipeline</p>
                <h2>运行状态</h2>
              </div>
              <span id="pipeline-status" class="status-pill status-neutral">Idle</span>
            </div>
            <div class="pipeline-meta">
              <div class="metric-row"><span>任务</span><strong id="pipeline-task">-</strong></div>
              <div class="metric-row"><span>进程</span><strong id="pipeline-pid">-</strong></div>
              <div class="metric-row"><span>返回码</span><strong id="pipeline-return-code">-</strong></div>
            </div>
            <pre id="pipeline-log" class="log-box">暂无运行日志</pre>
          </section>

          <section class="card section-block">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Signals</p>
                <h2>情绪分布</h2>
              </div>
            </div>
            <div id="sentiment-bars" class="bars"></div>
          </section>

          <section class="card section-block">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Routing</p>
                <h2>标签来源</h2>
              </div>
            </div>
            <div id="source-bars" class="bars"></div>
          </section>

          <section class="card section-block">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Hotspots</p>
                <h2>负向模块</h2>
              </div>
            </div>
            <div id="module-bars" class="bars"></div>
          </section>

          <section class="card section-block">
            <div class="section-head compact">
              <div>
                <p class="eyebrow">Deterministic Brief</p>
                <h2>规则摘要</h2>
              </div>
            </div>
            <div id="deterministic-report" class="rich-text compact-text"></div>
          </section>
        </aside>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
